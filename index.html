<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="hero-panel glass-card">
        <h1>Discovr</h1>
        <p>Meet creators, share moments, and build your vibe.</p>
        <ul>
          <li>⚡ Fast static hosting compatible with GitHub Pages</li>
          <li>🧊 Modern glassmorphism aesthetic</li>
          <li>☁️ Airtable-powered social data</li>
        </ul>
      </section>

      <section class="auth-card glass-card">
        <h2>Welcome back</h2>
        <p class="muted">Log in to open your social dashboard.</p>
        <div id="error-loginfail" class="error"></div>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your_username" />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" />

        <button id="loginBtn">Log In</button>
        <button id="adminLoginBtn" class="secondary">Admin Login</button>

        <p class="muted foot-note">
          New here? <a href="sign-up.html">Create an account</a>
        </p>
      </section>
    </main>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="script.js"></script>
  </body>
</html>
