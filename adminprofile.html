<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar glass-card">
      <h1>Discovr Admin</h1>
      <div class="search-wrap">
        <input id="searchVal" type="text" placeholder="Search user profile" />
        <button id="searchBtn">Search</button>
      </div>
      <div class="actions">
        <button id="openTable" class="secondary">User Manager</button>
        <button id="signOutBtn" class="danger">Sign Out</button>
      </div>
    </header>

    <main class="app-grid">
      <section class="profile-panel glass-card" id="profilepage"></section>
      <section class="feed-panel glass-card" id="postpage"></section>
    </main>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="admin-script-profile.js"></script>
  </body>
</html>
