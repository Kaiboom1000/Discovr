<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout signup-layout">
      <section class="hero-panel glass-card">
        <h1>Create your Discovr profile</h1>
        <p>Set up your profile in less than a minute.</p>
      </section>

      <section class="auth-card glass-card">
        <h2>Sign up</h2>
        <div id="error-signupfail" class="error"></div>

        <label for="user-name">Username</label>
        <input type="text" id="user-name" placeholder="unique username" />

        <label for="user-password">Password</label>
        <input type="password" id="user-password" placeholder="choose a strong password" />

        <label for="avatar-url">Avatar URL</label>
        <input type="url" id="avatar-url" placeholder="https://..." />

        <label for="aboutMe">About me</label>
        <textarea id="aboutMe" rows="3" placeholder="Tell everyone who you are"></textarea>

        <label for="BDate">Birth date</label>
        <input type="date" id="BDate" />

        <label>Gender</label>
        <div class="radio-row">
          <label><input type="radio" name="gender" value="male" /> Male</label>
          <label><input type="radio" name="gender" value="female" /> Female</label>
          <label><input type="radio" name="gender" value="other" /> Other</label>
        </div>

        <button id="check">Check Username</button>
        <button id="signup" class="primary">Create Account</button>

        <p class="muted foot-note">
          Already have an account? <a href="index.html">Go to login</a>
        </p>
      </section>
    </main>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="script.js"></script>
  </body>
</html>
