<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — User Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar glass-card">
      <h1>User Management</h1>
      <div class="actions">
        <button id="createDemoBtn">Add Demo User</button>
        <button id="backBtn" class="secondary">Back</button>
      </div>
    </header>

    <main class="glass-card table-shell">
      <table class="table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Avatar</th>
            <th>Posts</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="stationeryData"></tbody>
      </table>
    </main>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="admintabledelete.js"></script>
  </body>
</html>
