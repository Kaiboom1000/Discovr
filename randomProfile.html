<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — Profile Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar glass-card">
      <h1>Discovr Viewer</h1>
      <div class="actions">
        <button id="backBtn" class="secondary">Back</button>
      </div>
    </header>

    <main class="app-grid single">
      <section class="profile-panel glass-card" id="profilepage"></section>
      <section class="feed-panel glass-card" id="postpage"></section>
    </main>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="script-random-profile.js"></script>
  </body>
</html>
