<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovr — My Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar glass-card">
      <h1>Discovr</h1>
      <div class="search-wrap">
        <input id="searchVal" type="text" placeholder="Search by username" />
        <button id="searchBtn">Search</button>
      </div>
      <div class="actions">
        <button id="openComposer">New Post</button>
        <button id="signOutBtn" class="danger">Sign Out</button>
      </div>
    </header>

    <main class="app-grid">
      <section class="profile-panel glass-card" id="profilepage"></section>
      <section class="feed-panel glass-card" id="postpage"></section>
    </main>

    <dialog id="composerDialog" class="glass-dialog">
      <h3>Create post</h3>
      <label for="newPostUrl">Image URL</label>
      <input id="newPostUrl" type="url" placeholder="https://..." />
      <label for="pst-caption">Caption</label>
      <textarea id="pst-caption" rows="3"></textarea>
      <div class="dialog-actions">
        <button id="uploadBtn">Publish</button>
        <button id="closeComposer" class="secondary">Cancel</button>
      </div>
    </dialog>

    <div id="loading" class="loading-overlay"><div class="loader"></div></div>

    <script src="airtable-config.js"></script>
    <script src="app-core.js"></script>
    <script src="script-profile.js"></script>
  </body>
</html>
